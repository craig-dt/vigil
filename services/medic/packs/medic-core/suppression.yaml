# Dependency suppression (E3 §6): while a parent incident is open, a child incident
# is recorded but not routed. Each batch adds the entries whose parent it owns.
apiVersion: medic.suppression/v1
kind: Suppression
entries:
  # LLM path (F7 batch 2) ------------------------------------------------------
  - parent: {class: llm}
    children: {mode: P-4}
    why: Triage stalls whenever the LLM path is down (B5 P-4.a). Show the LLM fault, not the stall.
  - parent: {mode: L-5}
    children: {cause: P-2.e}
    why: A spent budget abandons runs (B5 P-2.e).
  - parent: {mode: L-3}
    children: {cause: P-2.e}
    why: LLM jobs with no consumer stall runs (B5 P-2.e).
